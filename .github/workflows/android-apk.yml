name: Build CodEX AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: codex-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory not found: $ANDROID_HOME"
            exit 1
          fi

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in the preinstalled Android SDK."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "CODEX_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$CODEX_SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$CODEX_SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Create Android platform when missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Add Android permissions (notifications and microphone)
        shell: bash
        run: |
          M=android/app/src/main/AndroidManifest.xml
          add() { grep -q "$1" "$M" || sed -i "s#<application#$2\n    <application#" "$M"; }
          add POST_NOTIFICATIONS '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          add RECORD_AUDIO '<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          add MODIFY_AUDIO_SETTINGS '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          grep -c "uses-permission" "$M"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK output
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "APK output was not created."
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CodEX-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
